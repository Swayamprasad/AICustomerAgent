<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Customer Support Assistant</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 24px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            max-width: 900px;
            width: 100%;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            height: 90vh;
            max-height: 700px;
        }

        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }

        .header h1 {
            font-size: 28px;
            font-weight: 600;
            margin-bottom: 8px;
        }

        .header p {
            opacity: 0.9;
            font-size: 14px;
        }

        .chat-window {
            flex: 1;
            padding: 30px;
            overflow-y: auto;
            background: #f8f9fa;
        }

        .message {
            margin-bottom: 20px;
            display: flex;
            align-items: flex-start;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .message.bot {
            justify-content: flex-start;
        }

        .message.user {
            justify-content: flex-end;
        }

        .message-content {
            max-width: 70%;
            padding: 16px 20px;
            border-radius: 18px;
            line-height: 1.6;
            font-size: 15px;
        }

        .message.bot .message-content {
            background: white;
            color: #2d3748;
            border-bottom-left-radius: 4px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }

        .message.user .message-content {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border-bottom-right-radius: 4px;
        }

        .avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 600;
            font-size: 16px;
            margin: 0 12px;
            flex-shrink: 0;
        }

        .message.bot .avatar {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .message.user .avatar {
            background: #e2e8f0;
            color: #667eea;
            order: 2;
        }

        .input-area {
            padding: 25px;
            background: white;
            border-top: 1px solid #e2e8f0;
        }

        .quick-actions {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
            flex-wrap: wrap;
        }

        .quick-btn {
            padding: 10px 18px;
            background: #f7fafc;
            border: 1px solid #e2e8f0;
            border-radius: 20px;
            font-size: 13px;
            cursor: pointer;
            transition: all 0.2s;
            color: #4a5568;
        }

        .quick-btn:hover {
            background: #667eea;
            color: white;
            border-color: #667eea;
            transform: translateY(-1px);
        }

        .input-wrapper {
            display: flex;
            gap: 12px;
            align-items: center;
        }

        #userInput {
            flex: 1;
            padding: 14px 20px;
            border: 2px solid #e2e8f0;
            border-radius: 24px;
            font-size: 15px;
            outline: none;
            transition: all 0.2s;
        }

        #userInput:focus {
            border-color: #667eea;
        }

        #sendBtn {
            padding: 14px 28px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 24px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            font-size: 15px;
        }

        #sendBtn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(102, 126, 234, 0.4);
        }

        #sendBtn:active {
            transform: translateY(0);
        }

        .typing-indicator {
            display: none;
            padding: 16px 20px;
            background: white;
            border-radius: 18px;
            border-bottom-left-radius: 4px;
            width: fit-content;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }

        .typing-indicator span {
            display: inline-block;
            width: 8px;
            height: 8px;
            background: #cbd5e0;
            border-radius: 50%;
            margin: 0 2px;
            animation: typing 1.4s infinite;
        }

        .typing-indicator span:nth-child(2) {
            animation-delay: 0.2s;
        }

        .typing-indicator span:nth-child(3) {
            animation-delay: 0.4s;
        }

        @keyframes typing {
            0%, 60%, 100% { transform: translateY(0); }
            30% { transform: translateY(-10px); }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🤖 AI Customer Assistant</h1>
            <p>Intelligent support powered by machine learning</p>
        </div>

        <div class="chat-window" id="chatWindow">
            <div class="message bot">
                <div class="avatar">AI</div>
                <div class="message-content">
                    Hello! I'm your AI customer support assistant. I can help you with order tracking, product information, returns, and general inquiries. How can I assist you today?
                </div>
            </div>
        </div>

        <div class="input-area">
            <div class="quick-actions">
                <button class="quick-btn" onclick="sendQuickMessage('Track my order')">📦 Track Order</button>
                <button class="quick-btn" onclick="sendQuickMessage('Return policy')">↩️ Returns</button>
                <button class="quick-btn" onclick="sendQuickMessage('Product info')">ℹ️ Product Info</button>
                <button class="quick-btn" onclick="sendQuickMessage('Speak to human')">👤 Human Support</button>
            </div>
            <div class="input-wrapper">
                <input type="text" id="userInput" placeholder="Type your message..." onkeypress="handleKeyPress(event)">
                <button id="sendBtn" onclick="sendMessage()">Send</button>
            </div>
        </div>
    </div>

    <script>
        const responses = {
            'track': 'To track your order, please provide your order number. You can find it in your confirmation email. Our system uses AI to provide real-time updates on your shipment location.',
            'order': 'I can help you track your order! Please share your order number (format: ORD-XXXXX) and I\'ll retrieve the latest shipping information for you.',
            'return': 'Our return policy allows returns within 30 days of purchase. Items must be unused and in original packaging. I can generate a prepaid return label for you. Would you like me to start the return process?',
            'policy': 'Our return policy: 30-day money-back guarantee, free return shipping, and instant refunds upon receipt. What specific item would you like to return?',
            'product': 'I can provide detailed product information including specifications, availability, pricing, and customer reviews. Which product are you interested in learning about?',
            'info': 'I\'m here to help with product details! Please share the product name or SKU, and I\'ll provide comprehensive information including features, compatibility, and user ratings.',
            'human': 'I\'ll connect you with a human agent right away. Current wait time is approximately 2-3 minutes. While you wait, is there anything I can help you with?',
            'speak': 'Connecting you to our customer service team. A human representative will join this chat shortly. Please stay on the line.',
            'help': 'I can assist with: 📦 Order Tracking, ↩️ Returns & Refunds, ℹ️ Product Information, 💳 Payment Issues, 🚚 Shipping Questions, and 👤 Connect to Human Support. What do you need help with?',
            'price': 'I can help you with pricing information. Please specify which product you\'re asking about, and I\'ll provide current pricing, available discounts, and bulk order options.',
            'shipping': 'We offer multiple shipping options: Standard (5-7 days, free on orders $50+), Express (2-3 days, $9.99), and Overnight ($24.99). International shipping is also available. Where are you shipping to?',
            'cancel': 'To cancel an order, please provide your order number. If the order hasn\'t shipped yet, I can cancel it immediately. If it\'s already in transit, I\'ll arrange a return instead.',
            'default': 'I understand you\'re asking about that. While I\'m continuously learning, I want to make sure you get the best help. Could you rephrase your question or choose from: Order Tracking, Returns, Product Info, or speak with a human agent?'
        };

        function sendMessage() {
            const input = document.getElementById('userInput');
            const message = input.value.trim();
            
            if (message === '') return;
            
            addMessage(message, 'user');
            input.value = '';
            
            showTypingIndicator();
            
            setTimeout(() => {
                hideTypingIndicator();
                const response = generateResponse(message);
                addMessage(response, 'bot');
            }, 1500);
        }

        function sendQuickMessage(message) {
            document.getElementById('userInput').value = message;
            sendMessage();
        }

        function addMessage(text, sender) {
            const chatWindow = document.getElementById('chatWindow');
            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${sender}`;
            
            const avatar = document.createElement('div');
            avatar.className = 'avatar';
            avatar.textContent = sender === 'bot' ? 'AI' : 'U';
            
            const content = document.createElement('div');
            content.className = 'message-content';
            content.textContent = text;
            
            messageDiv.appendChild(avatar);
            messageDiv.appendChild(content);
            chatWindow.appendChild(messageDiv);
            
            chatWindow.scrollTop = chatWindow.scrollHeight;
        }

        function generateResponse(message) {
            const lowerMessage = message.toLowerCase();
            
            for (let key in responses) {
                if (lowerMessage.includes(key)) {
                    return responses[key];
                }
            }
            
            return responses.default;
        }

        function showTypingIndicator() {
            const chatWindow = document.getElementById('chatWindow');
            const indicator = document.createElement('div');
            indicator.className = 'message bot';
            indicator.id = 'typingIndicator';
            indicator.innerHTML = `
                <div class="avatar">AI</div>
                <div class="typing-indicator" style="display: block;">
                    <span></span><span></span><span></span>
                </div>
            `;
            chatWindow.appendChild(indicator);
            chatWindow.scrollTop = chatWindow.scrollHeight;
        }

        function hideTypingIndicator() {
            const indicator = document.getElementById('typingIndicator');
            if (indicator) indicator.remove();
        }

        function handleKeyPress(event) {
            if (event.key === 'Enter') {
                sendMessage();
            }
        }
    </script>
</body>
</html>
